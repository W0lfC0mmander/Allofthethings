<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0e7490">
  <title>Review and approve</title>
  <link rel="icon" href="icons/icon-192.png">
  <style>
    @font-face { font-family: 'Great Vibes'; src: url('fonts/great-vibes.woff2') format('woff2'); font-display: block; }
    :root {
      --accent: #0e7490;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --bg: #f3f5f7;
      --card: #fff;
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
    header { background: var(--accent); color: #fff; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); }
    .head { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
    .head img { height: 44px; max-width: 120px; object-fit: contain; background: #fff; border-radius: 8px; padding: 4px; }
    .head h1 { margin: 0; font-size: 19px; font-weight: 600; }
    main { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; }
    .card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    h2 { margin: 0 0 4px; font-size: 20px; }
    h3 { margin: 0 0 12px; font-size: 16px; }
    .muted { color: var(--muted); font-size: 14px; }
    .message { white-space: pre-wrap; border-left: 3px solid var(--line); padding-left: 12px; color: #4b5563; margin: 16px 0 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 15px; }
    th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; padding: 0 0 6px; border-bottom: 1px solid var(--line); }
    td { padding: 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
    .num { text-align: right; white-space: nowrap; padding-left: 12px; }
    tfoot td { border: 0; padding: 6px 0 0; }
    .total td { font-weight: 700; font-size: 18px; padding-top: 10px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink); font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.wide { width: 100%; }
    .btn:disabled { opacity: .5; cursor: default; }
    .link { background: none; border: 0; padding: 8px 0; color: var(--muted); font: inherit; text-decoration: underline; cursor: pointer; }
    label.field-label { display: block; font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
    input[type=text], textarea { width: 100%; font: inherit; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; background: #fff; color: var(--ink); }
    .tabs { display: flex; gap: 0; border: 1px solid #cbd5e1; border-radius: 10px; overflow: hidden; margin: 16px 0 8px; }
    .tabs button { flex: 1; min-height: 40px; border: 0; background: #fff; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; }
    .tabs button.on { background: var(--accent); color: #fff; }
    .sigbox { position: relative; border: 1px dashed #94a3b8; border-radius: 10px; background: #fff; height: 140px; }
    .sigbox canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    .typed { height: 100%; display: flex; align-items: center; padding: 0 16px; font-family: 'Great Vibes', cursive; font-size: 44px; color: #14213d; overflow: hidden; white-space: nowrap; }
    .sigbox .hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #94a3b8; pointer-events: none; }
    .sigline { position: absolute; left: 16px; right: 16px; bottom: 28px; border-bottom: 1px solid #cbd5e1; pointer-events: none; }
    .clear { position: absolute; top: 6px; right: 8px; }
    .agree { display: flex; gap: 10px; align-items: flex-start; margin: 16px 0; font-size: 14px; }
    .agree input { width: 22px; height: 22px; flex: none; margin-top: 1px; accent-color: var(--accent); }
    .error { color: var(--danger); font-size: 14px; margin: 8px 0 0; }
    .done { text-align: center; }
    .done svg { width: 56px; height: 56px; color: var(--accent); }
    .center { text-align: center; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="head">
      <img id="logo" alt="" hidden>
      <h1 id="company">Proposal</h1>
    </div>
  </header>
  <main>
    <div id="loading" class="card center muted">Loading the proposal…</div>
    <div id="failed" class="card" hidden>
      <h2>This link isn’t working</h2>
      <p id="failed-text" class="muted"></p>
    </div>

    <div id="proposal" hidden>
      <section class="card">
        <h2 id="property"></h2>
        <div id="report" class="muted"></div>
        <p id="message" class="message" hidden></p>
        <table id="estimate" hidden>
          <thead><tr><th>Repair</th><th class="num">Qty</th><th class="num" id="amount-head">Amount</th></tr></thead>
          <tbody id="lines"></tbody>
          <tfoot id="sums"></tfoot>
        </table>
        <p id="unpriced" class="muted" hidden></p>
        <p style="margin:20px 0 0"><a id="pdf" class="btn wide" target="_blank" rel="noopener">View the full proposal (PDF)</a></p>
      </section>

      <section id="sign" class="card" hidden>
        <h3>Approve and sign</h3>
        <p id="approve-text" class="muted" style="margin:0"></p>
        <label class="field-label" for="name">Your full name</label>
        <input id="name" type="text" autocomplete="name" autocapitalize="words" maxlength="120">
        <div class="tabs" role="tablist">
          <button id="tab-type" type="button" class="on">Type</button>
          <button id="tab-draw" type="button">Draw</button>
        </div>
        <div id="box-type" class="sigbox"><div id="typed" class="typed"></div><div id="typed-hint" class="hint">Type your name above</div></div>
        <div id="box-draw" class="sigbox" hidden>
          <div class="sigline"></div>
          <canvas id="pad"></canvas>
          <div id="pad-hint" class="hint">Sign here with your finger</div>
          <button id="pad-clear" type="button" class="link clear">Clear</button>
        </div>
        <label class="agree"><input id="agree" type="checkbox"><span>I agree to sign electronically. My electronic signature is the legal equivalent of my handwritten signature, and I approve the proposal above.</span></label>
        <button id="approve" type="button" class="btn primary wide">Approve and sign</button>
        <p id="sign-error" class="error" hidden></p>
        <p class="center" style="margin:12px 0 0"><button id="decline-open" type="button" class="link">I don’t want to approve this</button></p>
      </section>

      <section id="decline" class="card" hidden>
        <h3>Decline the proposal</h3>
        <label class="field-label" for="reason">Anything you’d like them to know? <span class="muted">(optional)</span></label>
        <textarea id="reason" rows="4" maxlength="2000"></textarea>
        <p style="margin:16px 0 0"><button id="decline-send" type="button" class="btn wide">Decline</button></p>
        <p id="decline-error" class="error" hidden></p>
        <p class="center" style="margin:12px 0 0"><button id="decline-back" type="button" class="link">Back to approving</button></p>
      </section>

      <section id="answered" class="card done" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path id="answered-mark" d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <h2 id="answered-title"></h2>
        <p id="answered-text" class="muted"></p>
        <p><a id="signed-pdf" class="btn primary" target="_blank" rel="noopener" hidden>Download your signed copy</a></p>
      </section>
      <p id="contact" class="center muted"></p>
    </div>
  </main>
  <script type="module" src="js/approve.js"></script>
</body>
</html>
